name: QG - Python Ruff

on:
  workflow_call:
    inputs:
      policy-ref:
        description: Ref or tag to use for shared antiphoria policy files.
        required: false
        type: string
        default: main
      python-version:
        description: Python version for linting.
        required: false
        type: string
        default: "3.11"

permissions:
  contents: read

jobs:
  python-ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Checkout shared policy repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: antiphoria/.github
          ref: ${{ inputs.policy-ref }}
          path: .org-policy

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install Ruff from pinned+hashed lock file
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes --only-binary=:all: -r .org-policy/ci/requirements-ruff.txt

      - name: Ruff lint (JSON report)
        id: ruff_lint
        continue-on-error: true
        shell: bash
        run: ruff check . --config .org-policy/ruff.toml --output-format json -o ruff-results.json

      - name: Ruff format check
        id: ruff_format
        continue-on-error: true
        shell: bash
        run: ruff format . --config .org-policy/ruff.toml --check

      - name: Build Ruff summary JSON
        if: always()
        shell: bash
        env:
          RUFF_LINT_OUTCOME: ${{ steps.ruff_lint.outcome }}
          RUFF_FORMAT_OUTCOME: ${{ steps.ruff_format.outcome }}
        run: |
          total=0
          if [[ -f ruff-results.json ]]; then
            total="$(jq 'length' ruff-results.json 2>/dev/null || echo 0)"
          fi

          jq -n \
            --arg lint_outcome "$RUFF_LINT_OUTCOME" \
            --arg format_outcome "$RUFF_FORMAT_OUTCOME" \
            --argjson total_diagnostics "$total" \
            '{
              scanner: "ruff",
              lint_outcome: $lint_outcome,
              format_outcome: $format_outcome,
              total_diagnostics: $total_diagnostics
            }' > ruff-summary.json

      - name: Ruff summary for GitHub Step Summary
        if: always()
        shell: bash
        run: |
          echo "## Ruff" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          if [[ -f ruff-summary.json ]]; then
            total="$(jq -r '.total_diagnostics' ruff-summary.json)"
            lint_outcome="$(jq -r '.lint_outcome' ruff-summary.json)"
            format_outcome="$(jq -r '.format_outcome' ruff-summary.json)"
            echo "- Lint outcome: **${lint_outcome}**" >> "$GITHUB_STEP_SUMMARY"
            echo "- Format outcome: **${format_outcome}**" >> "$GITHUB_STEP_SUMMARY"
            echo "- Diagnostics: **${total}**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No \`ruff-summary.json\` produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Ruff artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qg-python-ruff-${{ github.run_id }}
          path: |
            ruff-results.json
            ruff-summary.json
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce Ruff outcomes
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.ruff_lint.outcome }}" != "success" ]; then
            echo "Ruff lint failed; see qg-python-ruff artifact."
            exit 1
          fi
          if [ "${{ steps.ruff_format.outcome }}" != "success" ]; then
            echo "Ruff format check failed; see job log."
            exit 1
          fi
