name: "Maintenance: Check pinned tool versions"

on:
  schedule:
    - cron: "0 7 1 */3 *"   # 07:00 UTC on the 1st of every 3rd month
  workflow_dispatch:          # manual trigger anytime

permissions:
  contents: write
  pull-requests: write

jobs:
  check-trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Check for new Trivy release
        id: trivy
        shell: bash
        run: |
          CURRENT="0.69.3"
          LATEST="$(curl -sSf https://api.github.com/repos/aquasecurity/trivy/releases/latest \
            | jq -r '.tag_name' | sed 's/^v//')"

          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"

          if [ "$CURRENT" = "$LATEST" ]; then
            echo "update_available=false" >> "$GITHUB_OUTPUT"
            echo "Trivy $CURRENT is current."
            exit 0
          fi

          echo "update_available=true" >> "$GITHUB_OUTPUT"
          echo "New Trivy release: $LATEST (current: $CURRENT)"

          # Download and compute hash
          curl -sSfL -o trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${LATEST}/trivy_${LATEST}_Linux-64bit.tar.gz"
          NEW_SHA="$(sha256sum trivy.tar.gz | cut -d' ' -f1)"
          echo "new_sha=$NEW_SHA" >> "$GITHUB_OUTPUT"

          # Check checksums file integrity
          curl -sSfL -o checksums.txt \
            "https://github.com/aquasecurity/trivy/releases/download/v${LATEST}/trivy_${LATEST}_checksums.txt"
          grep "$NEW_SHA" checksums.txt || { echo "HASH NOT IN CHECKSUMS FILE"; exit 1; }

          # Check if cosign attestation is now available (P3 readiness)
          COSIGN_HTTP="$(curl -sSfL -o /dev/null -w '%{http_code}' \
            "https://github.com/aquasecurity/trivy/releases/download/v${LATEST}/trivy_${LATEST}_checksums.txt.sig" \
            || echo 404)"
          echo "cosign_available=$([[ "$COSIGN_HTTP" = "200" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Update qg-trivy.yml
        if: steps.trivy.outputs.update_available == 'true'
        shell: bash
        env:
          NEW_VER: ${{ steps.trivy.outputs.latest }}
          NEW_SHA: ${{ steps.trivy.outputs.new_sha }}
          COSIGN: ${{ steps.trivy.outputs.cosign_available }}
        run: |
          TODAY="$(date +%Y-%m-%d)"
          sed -i "s|TRIVY_VERSION: \".*\"|TRIVY_VERSION: \"${NEW_VER}\"|" \
            .github/workflows/qg-trivy.yml
          sed -i "s|TRIVY_SHA256: \".*\"|TRIVY_SHA256: \"${NEW_SHA}\"|" \
            .github/workflows/qg-trivy.yml
          sed -i "s|# SHA256 verified via local download on .*|# SHA256 verified via automated pipeline on ${TODAY}|" \
            .github/workflows/qg-trivy.yml
          sed -i "s|# Source: .*checksums.txt|# Source: https://github.com/aquasecurity/trivy/releases/download/v${NEW_VER}/trivy_${NEW_VER}_checksums.txt|" \
            .github/workflows/qg-trivy.yml

      - name: Create Trivy update PR
        if: steps.trivy.outputs.update_available == 'true'
        uses: peter-evans/create-pull-request@5e914681df9dc83aa4e4905692ca88beb2f9e681 # v7
        with:
          branch: maintenance/trivy-${{ steps.trivy.outputs.latest }}
          title: "ci: update Trivy to v${{ steps.trivy.outputs.latest }}"
          body: |
            ## Automated pin update

            | Field | Value |
            |-------|-------|
            | **Current** | `v${{ steps.trivy.outputs.current }}` |
            | **New** | `v${{ steps.trivy.outputs.latest }}` |
            | **SHA-256** | `${{ steps.trivy.outputs.new_sha }}` |
            | **Cosign attestation available** | `${{ steps.trivy.outputs.cosign_available }}` |

            ### Review checklist
            - [ ] Verify the [release notes](https://github.com/aquasecurity/trivy/releases/tag/v${{ steps.trivy.outputs.latest }}) for breaking changes
            - [ ] Confirm SHA matches [checksums.txt](https://github.com/aquasecurity/trivy/releases/download/v${{ steps.trivy.outputs.latest }}/trivy_${{ steps.trivy.outputs.latest }}_checksums.txt)
            - [ ] If cosign=true, implement P3 cosign verification step
            - [ ] Run quality gate on a test spoke before merging
          labels: dependencies, ci, security

  check-ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Check for new Ruff release
        id: ruff
        shell: bash
        run: |
          CURRENT="$(grep -oP 'ruff==\K[0-9.]+' .org-policy/requirements-ruff.txt | head -1)"
          LATEST="$(curl -sSf https://api.github.com/repos/astral-sh/ruff/releases/latest \
            | jq -r '.tag_name' | sed 's/^v//')"

          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"

          if [ "$CURRENT" = "$LATEST" ]; then
            echo "update_available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "update_available=true" >> "$GITHUB_OUTPUT"

          # Generate new hashed requirements file
          pip download "ruff==${LATEST}" --only-binary=:all: -d /tmp/ruff-wheels
          {
            echo "# Pinned by maintenance workflow on $(date +%Y-%m-%d)"
            echo "# Release: https://github.com/astral-sh/ruff/releases/tag/v${LATEST}"
            for whl in /tmp/ruff-wheels/*.whl; do
              HASH="$(pip hash "$whl" | grep 'sha256:' | sed 's/.*sha256:/    --hash=sha256:/')"
              BASENAME="$(basename "$whl")"
              # Extract the pip requirement line from the filename
              echo "ruff==${LATEST} ${HASH}"
            done
          } > .org-policy/requirements-ruff.txt.new

      - name: Generate hashed requirements
        if: steps.ruff.outputs.update_available == 'true'
        shell: bash
        run: |
          pip download "ruff==${{ steps.ruff.outputs.latest }}" \
            --only-binary=:all: -d /tmp/ruff-dl

          # Build a proper --require-hashes compatible file
          echo "# Pinned by maintenance workflow on $(date +%Y-%m-%d)" > new-requirements.txt
          FIRST=true
          for whl in /tmp/ruff-dl/*.whl; do
            HASH="$(sha256sum "$whl" | cut -d' ' -f1)"
            if [ "$FIRST" = true ]; then
              echo -n "ruff==${{ steps.ruff.outputs.latest }} \\" >> new-requirements.txt
              echo "" >> new-requirements.txt
              FIRST=false
            fi
            echo "    --hash=sha256:${HASH} \\" >> new-requirements.txt
          done
          # Remove trailing backslash from last line
          sed -i '$ s/ \\$//' new-requirements.txt

          cp new-requirements.txt .org-policy/requirements-ruff.txt

      - name: Create Ruff update PR
        if: steps.ruff.outputs.update_available == 'true'
        uses: peter-evans/create-pull-request@5e914681df9dc83aa4e4905692ca88beb2f9e681 # v7
        with:
          branch: maintenance/ruff-${{ steps.ruff.outputs.latest }}
          title: "ci: update Ruff to v${{ steps.ruff.outputs.latest }}"
          body: |
            ## Automated pin update

            | Field | Value |
            |-------|-------|
            | **Current** | `v${{ steps.ruff.outputs.current }}` |
            | **New** | `v${{ steps.ruff.outputs.latest }}` |

            ### Review checklist
            - [ ] Review [changelog](https://github.com/astral-sh/ruff/releases/tag/v${{ steps.ruff.outputs.latest }}) for new rules or breaking changes
            - [ ] Verify generated hashes in `requirements-ruff.txt` cover all platforms
            - [ ] Run quality gate on a test spoke before merging
          labels: dependencies, ci

  check-codeaudit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Check for new CodeAudit release
        id: codeaudit
        shell: bash
        run: |
          CURRENT="$(grep -oP 'codeaudit==\K[0-9.]+' .org-policy/requirements-codeaudit.txt | head -1)"
          LATEST="$(pip index versions codeaudit 2>/dev/null \
            | grep -oP 'Available versions: \K[0-9.]+' || echo "$CURRENT")"

          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"

          if [ "$CURRENT" = "$LATEST" ]; then
            echo "update_available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "update_available=true" >> "$GITHUB_OUTPUT"

          pip download "codeaudit==${LATEST}" --no-deps -d /tmp/codeaudit-dl
          NEW_SHA="$(sha256sum /tmp/codeaudit-dl/*.whl | cut -d' ' -f1)"
          echo "new_sha=$NEW_SHA" >> "$GITHUB_OUTPUT"

      - name: Update CodeAudit pin
        if: steps.codeaudit.outputs.update_available == 'true'
        shell: bash
        env:
          NEW_VER: ${{ steps.codeaudit.outputs.latest }}
          NEW_SHA: ${{ steps.codeaudit.outputs.new_sha }}
        run: |
          # Update requirements file
          sed -i "s|codeaudit==.*|codeaudit==${NEW_VER}|" \
            .org-policy/requirements-codeaudit.txt

          # Update expected hash in workflow
          sed -i "s|EXPECTED_HASH=\".*\"|EXPECTED_HASH=\"${NEW_SHA}\"|" \
            .github/workflows/qg-python-codeaudit.yml

      - name: Create CodeAudit update PR
        if: steps.codeaudit.outputs.update_available == 'true'
        uses: peter-evans/create-pull-request@5e914681df9dc83aa4e4905692ca88beb2f9e681 # v7
        with:
          branch: maintenance/codeaudit-${{ steps.codeaudit.outputs.latest }}
          title: "ci: update CodeAudit to v${{ steps.codeaudit.outputs.latest }}"
          body: |
            ## Automated pin update

            | Field | Value |
            |-------|-------|
            | **Current** | `v${{ steps.codeaudit.outputs.current }}` |
            | **New** | `v${{ steps.codeaudit.outputs.latest }}` |
            | **Wheel SHA-256** | `${{ steps.codeaudit.outputs.new_sha }}` |

            ### Review checklist
            - [ ] Verify SHA against PyPI page
            - [ ] Run quality gate on a test spoke before merging
          labels: dependencies, ci
