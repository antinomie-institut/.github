name: Global Quality Gate

on:
  workflow_call:
    inputs:
      policy-ref:
        description: Ref or tag to use for shared antiphoria policy files.
        required: false
        type: string
        default: main
      python-version:
        description: Python version for Python-specific checks.
        required: false
        type: string
        default: "3.11"
      node-version:
        description: Node.js version for Node-specific checks.
        required: false
        type: string
        default: "20"
      # Safety rule: every run-* gate toggle defaults to false.
      run-trivy:
        description: Run Trivy filesystem scan.
        required: false
        type: boolean
        default: false
      run-python-ruff:
        description: Run Ruff lint and format checks for Python repositories.
        required: false
        type: boolean
        default: false
      run-python-test:
        description: Run Python unit tests from tests/ when present.
        required: false
        type: boolean
        default: false
      run-python-codeaudit:
        description: Run CodeAudit filescan for Python repositories (advisory).
        required: false
        type: boolean
        default: false
      run-node-quality:
        description: Run Node dependency install plus lint/check/build scripts.
        required: false
        type: boolean
        default: false
      run-ci-handoff:
        description: Build the Cursor handoff artifact bundle.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      has_python: ${{ steps.detect.outputs.has_python }}
      has_node: ${{ steps.detect.outputs.has_node }}
      package_manager: ${{ steps.detect.outputs.package_manager }}
    steps:
      - name: Checkout target repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Detect repository profile
        id: detect
        shell: bash
        run: |
          has_python=false
          has_node=false
          package_manager=npm

          if git ls-files '*.py' | grep -q .; then
            has_python=true
          fi

          if [ -f package.json ]; then
            has_node=true
          fi

          if [ -f pnpm-lock.yaml ]; then
            package_manager=pnpm
          elif [ -f yarn.lock ]; then
            package_manager=yarn
          fi

          echo "has_python=$has_python" >> "$GITHUB_OUTPUT"
          echo "has_node=$has_node" >> "$GITHUB_OUTPUT"
          echo "package_manager=$package_manager" >> "$GITHUB_OUTPUT"

  trivy:
    needs: detect
    if: ${{ inputs.run-trivy }}
    uses: ./.github/workflows/qg-trivy.yml
    with:
      policy-ref: ${{ inputs.policy-ref }}

  python-ruff:
    needs: detect
    if: ${{ inputs.run-python-ruff && needs.detect.outputs.has_python == 'true' }}
    uses: ./.github/workflows/qg-python-ruff.yml
    with:
      policy-ref: ${{ inputs.policy-ref }}
      python-version: ${{ inputs.python-version }}

  python-test:
    needs: detect
    if: ${{ inputs.run-python-test && needs.detect.outputs.has_python == 'true' }}
    uses: ./.github/workflows/qg-python-test.yml
    with:
      python-version: ${{ inputs.python-version }}

  python-codeaudit:
    needs: detect
    if: ${{ inputs.run-python-codeaudit && needs.detect.outputs.has_python == 'true' }}
    uses: ./.github/workflows/qg-python-codeaudit.yml
    with:
      policy-ref: ${{ inputs.policy-ref }}
      python-version: ${{ inputs.python-version }}

  node-quality:
    needs: detect
    if: ${{ inputs.run-node-quality && needs.detect.outputs.has_node == 'true' }}
    uses: ./.github/workflows/qg-node-quality.yml
    with:
      node-version: ${{ inputs.node-version }}
      package-manager: ${{ needs.detect.outputs.package_manager }}

  quality-gate:
    if: always()
    needs:
      - detect
      - trivy
      - python-ruff
      - python-test
      - node-quality
    runs-on: ubuntu-latest
    steps:
      - name: Verify blocking jobs
        shell: bash
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
          TRIVY_RESULT: ${{ needs.trivy.result }}
          PYTHON_RUFF_RESULT: ${{ needs.python-ruff.result }}
          PYTHON_TEST_RESULT: ${{ needs.python-test.result }}
          NODE_QUALITY_RESULT: ${{ needs.node-quality.result }}
        run: |
          failures=0

          check_blocker() {
            local job_name="$1"
            local job_result="$2"

            case "$job_result" in
              success|skipped)
                echo "$job_name: $job_result"
                ;;
              *)
                echo "$job_name: $job_result"
                failures=1
                ;;
            esac
          }

          check_blocker detect "$DETECT_RESULT"
          check_blocker trivy "$TRIVY_RESULT"
          check_blocker python-ruff "$PYTHON_RUFF_RESULT"
          check_blocker python-test "$PYTHON_TEST_RESULT"
          check_blocker node-quality "$NODE_QUALITY_RESULT"

          if [ "$failures" -ne 0 ]; then
            echo "The quality gate failed."
            exit 1
          fi

  ci-handoff:
    if: ${{ always() && inputs.run-ci-handoff }}
    needs:
      - detect
      - trivy
      - python-ruff
      - python-test
      - python-codeaudit
      - node-quality
      - quality-gate
    uses: ./.github/workflows/qg-ci-handoff.yml
    with:
      policy-ref: ${{ inputs.policy-ref }}
      detect-result: ${{ needs.detect.result }}
      trivy-result: ${{ needs.trivy.result }}
      python-ruff-result: ${{ needs.python-ruff.result }}
      python-test-result: ${{ needs.python-test.result }}
      python-codeaudit-result: ${{ needs.python-codeaudit.result }}
      node-quality-result: ${{ needs.node-quality.result }}
      quality-gate-result: ${{ needs.quality-gate.result }}
