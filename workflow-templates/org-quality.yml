# Legacy combined caller for member repos.
# Prefer stack-specific templates:
# - org-quality-python.yml
# - org-quality-node.yml
# - org-quality-security.yml
name: Org Quality (Legacy Combined)

on:
  pull_request:
  push:
    branches:
      - $default-branch
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    uses: antiphoria/.github/.github/workflows/quality-gate.yml@main
    with:
      policy-ref: main
      run-trivy: true
      run-python-ruff: true
      run-python-test: true
      run-node-quality: true
      run-ci-handoff: true
